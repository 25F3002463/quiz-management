# Render Blueprint: one web service with a persistent disk for the SQLite database.
services:
  - type: web
    name: markbook
    runtime: node
    plan: starter            # paid plan: free web services cannot attach a disk
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: markbook-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/markbook.db
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_EMAIL
        sync: false          # Render asks for this when you create the service
      - key: TEACHER_PASSWORD
        sync: false          # Render asks for this when you create the service
